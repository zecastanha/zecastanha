    <style>
        html, body {
            overflow-x: hidden;
        }

        .lojinha-page {
            min-height: 100vh;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
        }

        .lojinha-nav-wrap {
            width: 100%;
            padding: 25px 0;
            position: relative;
        }

        .lojinha-hero {
            text-align: center;
            padding: 60px 20px 20px;
            width: 100%;
        }

        .lojinha-hero .section-title {
            margin-bottom: 0;
        }

        /* ---- CAROUSEL ---- */
        .lojinha-carousel {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 70px;
            box-sizing: border-box;
            flex: 1;
        }

        .lojinha-viewport {
            overflow: hidden;
            width: 100%;
        }

        .lojinha-track {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }

        .lojinha-slide {
            min-width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .lojinha-img {
            width: 100%;
            max-width: 500px;
            max-height: 55vh;
            object-fit: contain;
            animation: lojFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 0 40px rgba(255, 193, 7, 0.25));
            user-select: none;
            -webkit-user-drag: none;
        }

        @keyframes lojFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-18px); }
        }

        /* ---- ARROWS ---- */
        .lojinha-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid rgba(255, 193, 7, 0.5);
            background: rgba(255, 193, 7, 0.08);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .lojinha-arrow:hover {
            background: rgba(255, 193, 7, 0.2);
            border-color: #FFC107;
            box-shadow: 0 0 25px rgba(255, 193, 7, 0.35);
        }

        .lojinha-arrow:active {
            transform: translateY(-50%) scale(0.92);
        }

        .lojinha-arrow--prev { left: 10px; }
        .lojinha-arrow--next { right: 10px; }

        /* SVG arrow icons */
        .lojinha-arrow svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #FFC107;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ---- DOTS ---- */
        .lojinha-dots {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        .lojinha-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid rgba(255, 193, 7, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lojinha-dot.active {
            background: #FFC107;
            box-shadow: 0 0 12px rgba(255, 193, 7, 0.6);
            border-color: #FFC107;
        }

        /* ---- FOOTER CTA ---- */
        .lojinha-footer {
            text-align: center;
            padding: 10px 20px 50px;
            width: 100%;
        }

        /* ---- MOBILE ---- */
        @media (max-width: 850px) {
            .lojinha-nav-wrap .premium-nav {
                display: none;
            }

            .lojinha-hero {
                padding: 20px 16px 10px;
            }

            .lojinha-carousel {
                padding: 0 16px;
            }

            .lojinha-arrow {
                width: 40px;
                height: 40px;
            }

            .lojinha-arrow svg {
                width: 16px;
                height: 16px;
            }

            .lojinha-arrow--prev { left: 4px; }
            .lojinha-arrow--next { right: 4px; }

            .lojinha-slide {
                padding: 5px;
            }

            .lojinha-img {
                max-height: 50vh;
                max-width: calc(100vw - 100px);
            }
        }

        @media (max-width: 480px) {
            .lojinha-carousel {
                padding: 0 10px;
            }

            .lojinha-arrow {
                width: 34px;
                height: 34px;
            }

            .lojinha-arrow svg {
                width: 14px;
                height: 14px;
            }

            .lojinha-arrow--prev { left: 2px; }
            .lojinha-arrow--next { right: 2px; }

            .lojinha-img {
                max-height: 45vh;
                max-width: calc(100vw - 80px);
            }
        }

    <script src="../script.js"></script>
    <script>
        (function() {
            var productNames = [
                'caneca e tirante',
                'bandana',
                'ecocopo',
                'oculos',
                'tirante'
            ];

            var track = document.getElementById('track');
            var titleEl = document.getElementById('productTitle');
            var dots = document.querySelectorAll('.lojinha-dot');
            var prevBtn = document.getElementById('prevBtn');
            var nextBtn = document.getElementById('nextBtn');
            var total = productNames.length;
            var current = 0;

            function goTo(index) {
                if (index < 0) index = total - 1;
                if (index >= total) index = 0;
                current = index;
                track.style.transform = 'translateX(-' + (current * 100) + '%)';
                titleEl.textContent = productNames[current];
                dots.forEach(function(dot, i) {
                    dot.classList.toggle('active', i === current);
                });
            }

            prevBtn.addEventListener('click', function() { goTo(current - 1); });
            nextBtn.addEventListener('click', function() { goTo(current + 1); });

            dots.forEach(function(dot) {
                dot.addEventListener('click', function() {
                    goTo(parseInt(dot.getAttribute('data-index')));
                });
            });

            // Touch/Swipe support
            var startX = 0;
            var startY = 0;
            var isDragging = false;
            var diffX = 0;
            var viewport = document.querySelector('.lojinha-viewport');

            viewport.addEventListener('touchstart', function(e) {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                isDragging = true;
                track.style.transition = 'none';
            }, { passive: true });

            viewport.addEventListener('touchmove', function(e) {
                if (!isDragging) return;
                diffX = e.touches[0].clientX - startX;
                var diffY = e.touches[0].clientY - startY;
                // Only handle horizontal swipes
                if (Math.abs(diffX) > Math.abs(diffY)) {
                    var offset = -(current * 100) + (diffX / viewport.offsetWidth * 100);
                    track.style.transform = 'translateX(' + offset + '%)';
                }
            }, { passive: true });

            viewport.addEventListener('touchend', function() {
                if (!isDragging) return;
                isDragging = false;
                track.style.transition = 'transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                if (diffX > 50) {
                    goTo(current - 1);
                } else if (diffX < -50) {
                    goTo(current + 1);
                } else {
                    goTo(current);
                }
                diffX = 0;
            }, { passive: true });

            // Keyboard navigation
            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowLeft') goTo(current - 1);
                if (e.key === 'ArrowRight') goTo(current + 1);
            });
        })();
    </script>
